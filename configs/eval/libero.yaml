# In-distribution evaluation: LIBERO, four suites, ten tasks each.
exp_name: eval_libero
seed: 0

control:
  chunk_H: 8
  action_dim: 7
  image_size: 224

plan:
  max_len: 6

solver:
  name: remote
  host: 127.0.0.1
  port: 5678

env:
  benchmark: LIBERO
  suites: [libero_spatial, libero_object, libero_goal, libero_10]
  tasks_per_suite: 10

eval:
  policy: nsvla         # "solver_bare" evaluates the action solver on its own
  episodes_per_task: 50
  seeds: [0, 1, 2]
